apiVersion: v1
kind: Service
metadata:
  name: backend-counter-service
  namespace: default
  labels:
    app: backend-counter
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: backend-counter
