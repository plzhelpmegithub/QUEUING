replicaCount: 2  # 항상 2개 Pod를 유지 (트래픽 분산용)

image:
  repository: "ttomang/backend-counter"  # Docker Hub 이미지 경로
  tag: "1.0.10"                            # 이미지 버전
  pullPolicy: IfNotPresent

service:
  type: NodePort   # 부하테스트용 ALB 타겟그룹 연결 (노드가 사설 서브넷이라 외부 노출 없음)
  port: 8080
  nodePort: 30083

env:
  # ⚠️ TODO: RDS 생성 후 실제 엔드포인트로 교체 필요
  # 예: queuing-db.xxxxxxxxxx.ap-northeast-2.rds.amazonaws.com
  dbHost: "queuing-mariadb.cto8u6c4yxyv.ap-northeast-2.rds.amazonaws.com"
  dbPort: "3306"
  dbUser: "team2"
  # K8s 서비스 이름 방식 - AWS EKS에서도 네임스페이스 구조 동일하게 유지하면 그대로 사용 가능
  dbName: "queuing_db"                   # 👈 새로 추가 — JDBC URL에 DB 이름이 필요함
  redisHost: "redis-counter-master.redis.svc.cluster.local"
  redisPort: "6379"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleUp:
      selectPolicy: Max
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
