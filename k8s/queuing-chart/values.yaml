replicaCount: 2  # 항상 2개 Pod를 유지 (트래픽 분산용)

image:
  repository: "ttomang/backend-counter"  # Docker Hub 이미지 경로
  tag: "1.0.6"                            # 이미지 버전 - 새로 빌드할 때마다 여기 숫자 올려야 함
  pullPolicy: IfNotPresent                 # 이미 로컬에 있으면 새로 안 받아옴 (태그 바뀌면 자동으로 새로 받음)

service:
  type: NodePort       # 클러스터 노드의 특정 포트로 외부 접근 허용
  port: 8080            # 애플리케이션이 내부적으로 쓰는 포트
  nodePort: 30083        # 외부에서 접속할 때 쓰는 포트 (30000번대 고정)

env:
  dbHost: "211.46.52.164"   # MariaDB 서버 주소 (온프레미스 고정 IP)
  dbPort: "13306"            # MariaDB 포트
  dbUser: "team2"             # MariaDB 접속 계정 이름 (DB_USER 환경변수로 전달됨)
  # 👇 팀 공용 Redis가 아니라, 우리가 인증(비밀번호)까지 설정한 전용 Redis를 가리킴
  # (redis 네임스페이스에 배포한 redis-counter-master)
  redisHost: "redis-counter-master.redis.svc.cluster.local"
  redisPort: "6379"

# 오토스케일링(HPA) 설정 - CPU 사용률 80% 넘으면 Pod 자동으로 늘어남 (최대 10개)
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  behavior:
    scaleDown:                    # Pod 줄어들 때 규칙
      stabilizationWindowSeconds: 60   # 트래픽 줄어도 60초는 지켜본 뒤 축소
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleUp:                      # Pod 늘어날 때 규칙
      selectPolicy: Max
      stabilizationWindowSeconds: 0    # 트래픽 몰리면 지체 없이 즉시 확장
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
