apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-counter
  namespace: queuing-d       # D파트 전용 네임스페이스
  labels:
    app: backend-counter
spec:
  replicas: {{ .Values.replicaCount }}   # values.yaml의 replicaCount 값을 그대로 가져다 씀
  selector:
    matchLabels:
      app: backend-counter
  template:
    metadata:
      labels:
        app: backend-counter
    spec:
      # Docker Hub에서 private 이미지를 받아올 때 필요한 인증 정보
      imagePullSecrets:
        - name: regcred
      containers:
      - name: backend-counter
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"   # 예: ttomang/backend-counter:1.0.6
        imagePullPolicy: IfNotPresent
        resources:
          requests:              # 이 Pod가 "최소한 이 정도는 보장받아야 한다"는 요청량
            cpu: "100m"
            memory: "128Mi"
          limits:                 # 이 Pod가 "이 이상은 못 쓴다"는 최대 제한 (HPA 계산에도 씀)
            cpu: "500m"
            memory: "256Mi"
        env:
        # ===== [보안] DB 비밀번호 — 평문 대신 Kubernetes Secret에서 안전하게 가져옴 =====
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-counter-secret   # 지예가 queuing-d 네임스페이스에 만든 Secret 이름
              key: db-password                # Secret 안의 db-password 키 값을 가져옴

        # ===== [보안] Redis 비밀번호 — 마찬가지로 Secret에서 가져옴 =====
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-counter-secret
              key: redis-password

        # ===== 일반 설정값 (비밀번호 아님, 그냥 values.yaml에서 그대로 전달) =====
        - name: SERVER_PORT
          value: "{{ .Values.service.port }}"
        - name: DB_HOST
          value: "{{ .Values.env.dbHost }}"
        - name: DB_PORT
          value: "{{ .Values.env.dbPort }}"
        - name: DB_USER                        # 👈 지예가 지적한 부분 - 이번에 새로 추가
          value: "{{ .Values.env.dbUser }}"
        - name: REDIS_HOST
          value: "{{ .Values.env.redisHost }}"   # 👈 이제 전용 Redis 주소를 가리킴
        - name: REDIS_PORT
          value: "{{ .Values.env.redisPort }}"

        # 추가로 커스텀 환경변수를 넣고 싶을 때 쓰는 반복문 (지금은 안 씀)
{{- if .Values.env.custom }}
{{- range $key, $val := .Values.env.custom }}
        - name: {{ $key }}
          value: "{{ $val }}"
{{- end }}
{{- end }}

        ports:
        - containerPort: {{ .Values.service.port }}

        # 이 Pod가 "살아있는지" 주기적으로 확인 (죽어있으면 재시작)
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: {{ .Values.service.port }}
          initialDelaySeconds: 15   # 컨테이너 뜨고 15초 뒤부터 확인 시작
          periodSeconds: 20          # 20초마다 확인

        # 이 Pod가 "트래픽 받을 준비가 됐는지" 확인 (준비 안 됐으면 트래픽 안 보냄)
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: {{ .Values.service.port }}
          initialDelaySeconds: 15
          periodSeconds: 20
