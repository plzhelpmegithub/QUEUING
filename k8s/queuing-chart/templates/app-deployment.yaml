apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-counter
  namespace: queuing-d
  labels:
    app: backend-counter
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: backend-counter
  template:
    metadata:
      labels:
        app: backend-counter
    spec:
      # 👇 도커허브 출입증은 Pod의 spec(template.spec) 안에 들어가는 게 정석이야!
      imagePullSecrets:
        - name: regcred
      containers:
      - name: backend-counter
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        env:
        # =========================================================
        # [보안 적용] DB 비밀번호를 평문 대신 K8s Secret에서 안전하게 참조
        # =========================================================
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-counter-secret # 지예에게 생성을 요청한 시크릿 이름
              key: db-password             # 시크릿 내부의 데이터 키
              
        # =========================================================
        # [보안 적용] Redis 비밀번호를 평문 대신 K8s Secret에서 안전하게 참조
        # =========================================================
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-counter-secret # 지예에게 생성을 요청한 시크릿 이름
              key: redis-password          # 시크릿 내부의 데이터 키

        # 일반 환경 변수 매핑
        - name: SERVER_PORT
          value: "{{ .Values.service.port }}"
        - name: DB_HOST
          value: "{{ .Values.env.dbHost }}"
        - name: DB_PORT
          value: "{{ .Values.env.dbPort }}"
        - name: REDIS_HOST
          value: "{{ .Values.env.redisHost }}"
        - name: REDIS_PORT
          value: "{{ .Values.env.redisPort }}"
          
{{- if .Values.env.custom }}
{{- range $key, $val := .Values.env.custom }}
        - name: {{ $key }}
          value: "{{ $val }}"
{{- end }}
{{- end }}
        ports:
        - containerPort: {{ .Values.service.port }}
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: {{ .Values.service.port }}
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: {{ .Values.service.port }}
          initialDelaySeconds: 15
          periodSeconds: 20
