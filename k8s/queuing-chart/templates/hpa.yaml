{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-counter-hpa
  labels:
    app: backend-counter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-counter
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.metrics }}
{{ toYaml .Values.autoscaling.metrics | indent 4 }}
    {{- else }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage | default 80 }}
    {{- end }}
  # 👇 팀원이 요청한 스케일다운 60초 behavior 설정 추가 완료!
  {{- if .Values.autoscaling.behavior }}
  behavior:
{{ toYaml .Values.autoscaling.behavior | indent 4 }}
  {{- end }}
{{- end }}
