cat > redis.yaml << 'EOF'
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-counter-pvc
  namespace: redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-counter-master
  namespace: redis
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis-counter
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-counter-master
  namespace: redis
spec:
  serviceName: redis-counter-master
  replicas: 1
  selector:
    matchLabels:
      app: redis-counter
  template:
    metadata:
      labels:
        app: redis-counter
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-counter-secret
              key: password
        command: ["sh", "-c", "redis-server --appendonly yes --appendfsync everysec --dir /data --requirepass $(REDIS_PASSWORD)"]
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: redis-counter-pvc
EOF
