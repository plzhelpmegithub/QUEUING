apiVersion: v1
kind: Service
metadata:
  name: redis-counter-master
  namespace: redis
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis-counter
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-counter-master
  namespace: redis
spec:
  serviceName: redis-counter-master
  replicas: 1
  selector:
    matchLabels:
      app: redis-counter
  template:
    metadata:
      labels:
        app: redis-counter
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-counter
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-counter
  template:
    metadata:
      labels:
        app: backend-counter
    spec:
      containers:
      - name: backend-counter
        image: backend-counter:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATA_REDIS_HOST
          value: redis-counter-master.redis.svc.cluster.local
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-counter-service
  namespace: default
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: backend-counter
