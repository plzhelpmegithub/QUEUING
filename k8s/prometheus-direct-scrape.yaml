apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-custom-scrape-config
  namespace: monitoring
data:
  backend-counter.yaml: |
    scrape_configs:
      - job_name: 'backend-counter-direct'
        static_configs:
          - targets: ['backend-counter-service.default.svc.cluster.local:8080']
        metrics_path: '/actuator/prometheus'
        scrape_interval: 5s
