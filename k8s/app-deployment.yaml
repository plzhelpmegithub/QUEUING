apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-counter
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-counter
  template:
    metadata:
      labels:
        app: backend-counter
    spec:
      containers:
      - name: backend-counter
        image: backend-counter:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATA_REDIS_HOST
          value: redis-counter-master.redis.svc.cluster.local
        - name: SPRING_DATA_REDIS_PORT
          value: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-counter-service
  namespace: default
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: backend-counter
