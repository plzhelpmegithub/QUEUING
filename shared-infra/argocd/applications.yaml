# ArgoCD Application 3개 — destroy 후 다시 만들 때 kubectl apply -f 로 넣는다.
# 2026-09-15 운영 중인 설정을 그대로 옮겼다. 비밀값은 없다.
# 모두 자동 동기화(syncPolicy) 없음 = UI 에서 SYNC 를 눌러야 배포된다.
#
# ⚠️ A(api)의 SES 역할(eks.amazonaws.com/role-arn)은 여기 없다.
#    queuing-aws.ps1 up 이 helm 설치 때 --set-string 으로 넣고, ArgoCD SYNC 해도 지워지지 않는다.
# ⚠️ realtime-ws 의 redisHost 는 ElastiCache 주소다. up 후 주소가 같은지 확인할 것:
#    aws elasticache describe-replication-groups --replication-group-id queuing-redis --query "ReplicationGroups[0].NodeGroups[0].PrimaryEndpoint.Address" --output text
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: queuing-api-a
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/plzhelpmegithub/QUEUING.git
    targetRevision: feature/chan
    path: redis-api-chart
    helm:
      releaseName: api
  destination:
    server: https://kubernetes.default.svc
    namespace: queuing-a
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: queuing-monitor-d
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/plzhelpmegithub/QUEUING.git
    targetRevision: yeji/aws-migration
    path: k8s/queuing-chart
    helm:
      releaseName: counter
  destination:
    server: https://kubernetes.default.svc
    namespace: queuing-d
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: realtime-ws
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/plzhelpmegithub/QUEUING.git
    targetRevision: feature-jiye
    path: realtime-ws/helm-chart/realtime-ws-chart
    helm:
      releaseName: realtime-ws
      valuesObject:
        env:
          redisHost: queuing-redis.wxbnsp.ng.0001.apn2.cache.amazonaws.com
        statsRedis:
          host: redis-counter-master.redis.svc.cluster.local
  destination:
    server: https://kubernetes.default.svc
    namespace: realtime
