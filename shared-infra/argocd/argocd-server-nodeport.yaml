# ArgoCD 웹 화면을 ALB 로 내보내는 NodePort (2026-09-18)
#
# 설치본의 argocd-server 서비스(ClusterIP)는 그대로 둔다. 그걸 NodePort 로 바꾸면
# ArgoCD 를 다시 설치하거나 올릴 때 설치 매니페스트가 되돌려 버린다.
# 짝이 되는 ALB 규칙은 terraform-final/argocd_access.tf (학원 IP 만 허용).
#
#   kubectl apply -f shared-infra/argocd/argocd-server-nodeport.yaml
apiVersion: v1
kind: Service
metadata:
  name: argocd-server-nodeport
  namespace: argocd
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: argocd-server
  # argocd-server 는 8080 한 포트에서 TLS 로 응답한다. ALB 는 HTTPS 로 붙는다.
  ports:
    - name: https
      port: 443
      targetPort: 8080
      nodePort: 30085
      protocol: TCP
