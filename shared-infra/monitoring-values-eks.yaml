# ──────────────────────────────────────────────
# kube-prometheus-stack — EKS 용 values
#
# 온프레미스용은 monitoring-values.yaml 에 그대로 두고, EKS 용을 따로 둔다.
# 두 환경의 제약이 정반대라 한 파일로 합치면 오히려 헷갈린다.
#
# ■ 적용
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm -n monitoring upgrade --install monitoring \
#     prometheus-community/kube-prometheus-stack --version 88.6.0 \
#     -f shared-infra/monitoring-values-eks.yaml --timeout 10m
#
#   ⚠️ --version 을 고정할 것. 빼면 최신 차트로 올라가 구성이 바뀐다.
#
# ■ 릴리즈 이름은 반드시 monitoring 이다
#   ServiceMonitor 들이 release: monitoring 라벨로 선택된다. prometheus 로 깔면
#   선택자가 어긋나 기존 ServiceMonitor 가 전부 수집 대상에서 빠진다.
#   온프레미스에서 실제로 겪은 문제다.
#
# ■ 온프레미스 values 와 다른 점
#   Grafana        : 껐던 것을 켠다 (아래 이유 참고)
#   NodePort       : 전부 ClusterIP 로. EKS 는 ALB 를 쓰고, NodePort 를 열면
#                    노드 보안그룹에 구멍이 생긴다
#   volumeName     : 제거. 온프레미스 hostPath PV 참조였다.
#                    EKS 는 EBS CSI 가 PVC 를 보고 볼륨을 자동 생성한다
#   persistence    : 켠다. hostPath 마운트 타임아웃 문제가 EBS 에는 없다
# ──────────────────────────────────────────────

grafana:
  # ■ 온프레미스에서는 껐지만 EKS 에서는 켠다
  #
  # 밖으로 뺐던 이유가 세 개였는데 두 개가 사라졌다.
  #   1) 권한 — 예지님이 pre-upgrade 훅에서 막혔다
  #      → EKS 에서도 여전하지만, 설치는 클러스터 생성자가 하고 예지님은
  #        Grafana UI 안에서 작업하면 된다. UI 작업에는 K8s 권한이 필요 없다.
  #   2) 감시 대상 안에 있으면 같이 죽는다
  #      → EKS 는 컨트롤 플레인을 AWS 가 관리한다. 노드가 죽어도 다른 노드로
  #        옮겨간다. 온프레미스만큼 걱정할 일이 아니다.
  #   3) 파드 재시작마다 대시보드 초기화
  #      → hostPath 마운트 실패로 persistence 를 꺼서 생긴 문제였다.
  #        EBS CSI 를 쓰면 해결된다.
  enabled: true

  # ⚠️ 비밀번호를 여기 적지 않는다.
  # 예지님 안에는 grafana.adminPassword = "admin1234" 가 평문으로 있었는데,
  # 그러면 깃에도 남고 helm 의 저장된 values 에도 남는다.
  # Secret 을 먼저 만들고 참조한다.
  #
  #   kubectl -n monitoring create secret generic grafana-admin \
  #     --from-literal=admin-user=admin \
  #     --from-literal=admin-password='<직접 정한 값>'
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # 대시보드와 알림 설정을 파드 재시작 후에도 유지한다.
  # EBS CSI 드라이버가 PVC 를 보고 볼륨을 자동으로 만든다 (irsa.tf 참고).
  persistence:
    enabled: true
    size: 5Gi
    # storageClassName 을 적지 않으면 클러스터 기본값을 쓴다.
    # EKS 는 gp2 가 기본이다. gp3 를 쓰려면 StorageClass 를 따로 만들어야 한다.

  # ReadWriteOnce 볼륨은 파드 하나만 붙을 수 있다. 기본 RollingUpdate 는
  # 새 파드를 먼저 띄우려 해서 서로 기다리는 교착이 생긴다.
  deploymentStrategy:
    type: Recreate

  # ⚠️ ClusterIP 다. 외부 접속은 두 가지 중 하나로 한다.
  #   1) kubectl port-forward — 지금 방식. 노출 0
  #        kubectl -n monitoring port-forward svc/monitoring-grafana 3000:80
  #   2) ALB 로 노출 — 팀이 같이 보려면. alb.tf 에 타겟그룹 추가가 필요하다.
  #      Grafana 는 자체 로그인이 있어 노출해도 되지만, Prometheus 는
  #      인증이 전혀 없으므로 절대 직접 노출하지 않는다.
  service:
    type: ClusterIP
    port: 80

prometheus:
  # ⚠️ ClusterIP. 온프레미스는 NodePort 30092 였다.
  # Prometheus 에는 인증이 없다. 인터넷에 열면 모든 네임스페이스·파드 이름,
  # 요청량, 에러율, 레이블에 담긴 내부 정보를 누구나 읽는다.
  service:
    type: ClusterIP

  prometheusSpec:
    # ⚠️ volumeName 을 지웠다.
    # 온프레미스에서는 손으로 만든 hostPath PV(prometheus-pv)를 가리켰다.
    # EKS 에는 그 PV 가 없고, EBS CSI 가 PVC 를 보고 볼륨을 자동 생성한다.
    # volumeName 을 남겨두면 없는 PV 를 기다리며 영원히 Pending 이 된다.
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    retention: 7d

    # ⚠️ 노드 메모리가 온프레미스의 절반이다 (14.4Gi -> 8Gi).
    # Prometheus 는 이 스택에서 가장 무거운 파드라 상한을 걸어둔다.
    # 부족하면 retention 을 줄이거나 노드를 늘린다.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

    # 모든 네임스페이스의 ServiceMonitor 를 수집한다.
    # release: monitoring 라벨이 붙은 것만 선택된다 (차트 기본 동작).
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

# ■ SMTP 와 알림 라우팅은 여기 넣지 않았다
# 온프레미스 values 의 grafana.ini / alerting 블록을 그대로 옮기면 되지만,
# Gmail 앱 비밀번호가 Secret(grafana-smtp)에 있어야 한다. EKS 에는 아직
# 그 Secret 이 없다. 예지님이 Grafana 를 띄운 뒤 필요할 때 옮기는 편이
# 순서상 낫다. 내용은 monitoring-values.yaml 에 그대로 남아 있다.
