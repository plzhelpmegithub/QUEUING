# ──────────────────────────────────────────────
# LocalStack — 건아님 PC(192.168.0.191)에서 돌던 가짜 AWS(SES/SNS)를
# 지예님 클러스터 안으로 통합.
#
# 진짜 AWS 자격증명이 아니라 LocalStack 관례상 더미값("test")을 쓰므로
# Secret 불필요 — YAML에 그대로 둬도 안전함.
#
# ■ 적용
#   kubectl apply -f localstack.yaml
#
# ■ 확인
#   kubectl get pods -n queuing-localstack
#   kubectl port-forward -n queuing-localstack svc/localstack 4566:4566
#   curl http://localhost:4566/_localstack/health
#
# ■ SQS 큐는 부팅할 때 자동 생성된다 (2026-09-08 추가)
#   LocalStack은 데이터를 메모리에만 두므로 파드가 새로 뜨면 큐가 사라진다.
#   예전에는 재시작할 때마다 손으로 다시 만들어야 했는데, 잊어버리면 KEDA가
#   NonExistentQueue 오류를 내고 B파트 ScaledObject 가 Degraded 로 떨어진다.
#   (2026-09-08 실제로 이 증상이 발생 — ArgoCD queuing-worker-b 가 Degraded)
#
#   이제 아래 localstack-init ConfigMap 의 스크립트가
#   /etc/localstack/init/ready.d/ 에 마운트되어, LocalStack 이 준비되는 시점에
#   큐를 자동으로 만든다. 재시작 후 손으로 할 일은 없다.
#
#   확인:
#   kubectl exec -n queuing-localstack deploy/localstack -- \
#     awslocal sqs list-queues --region ap-northeast-2
#
#   ※ 리전을 명시하지 않으면 awslocal 이 us-east-1 에 만들어버린다.
#     LocalStack 은 리전별로 큐를 따로 관리해서, KEDA 가
#     awsRegion: ap-northeast-2 로 조회하면 못 찾는다.
#     init 스크립트에 --region 을 반드시 넣어야 하는 이유다.
# ──────────────────────────────────────────────

apiVersion: v1
kind: Namespace
metadata:
  name: queuing-localstack
---
# LocalStack 은 /etc/localstack/init/ready.d/ 안의 스크립트를 "준비 완료" 시점에
# 실행한다. 여기에 큐 생성을 넣어두면 파드가 몇 번을 재시작하든 큐가 항상 존재한다.
# (LocalStack 커뮤니티 에디션에서 지원하는 init hook)
apiVersion: v1
kind: ConfigMap
metadata:
  name: localstack-init
  namespace: queuing-localstack
data:
  01-create-queues.sh: |
    #!/bin/bash
    # B파트(건아) 재판매 워커용 큐. KEDA ScaledObject 가 이 큐의 길이를 보고
    # email-worker 를 0↔10 으로 오토스케일링한다.
    # --region 을 빼면 us-east-1 에 생성되어 KEDA(ap-northeast-2)가 못 찾는다.
    awslocal sqs create-queue \
      --queue-name resale-queue \
      --region ap-northeast-2

    echo "[init] SQS 큐 준비 완료:"
    awslocal sqs list-queues --region ap-northeast-2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: queuing-localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3
          ports:
            - containerPort: 4566
          env:
            # 팀이 실제로 쓰는 서비스만 활성화 — 다 켜면 시작이 느려지고 리소스만 더 먹음
            #   ses, sns : A파트(찬규) 알림 기능
            #   sqs      : B파트(건아) 재판매 워커 + KEDA 오토스케일링 트리거
            - name: SERVICES
              value: "sqs,ses,sns"
            - name: DEFAULT_REGION
              value: "ap-northeast-2"
            # awslocal CLI가 참조하는 값. DEFAULT_REGION만으로는 CLI가
            # us-east-1을 쓰기 때문에 리전이 어긋난다.
            - name: AWS_DEFAULT_REGION
              value: "ap-northeast-2"
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: init-scripts
              mountPath: /etc/localstack/init/ready.d
      volumes:
        - name: init-scripts
          configMap:
            name: localstack-init
            defaultMode: 0755 # 실행 권한이 없으면 LocalStack 이 스크립트를 건너뛴다
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: queuing-localstack
spec:
  selector:
    app: localstack
  ports:
    - port: 4566
      targetPort: 4566
  type: ClusterIP
