# ──────────────────────────────────────────────
# LocalStack — 건아님 PC(192.168.0.191)에서 돌던 가짜 AWS(SES/SNS)를
# 지예님 클러스터 안으로 통합.
#
# 진짜 AWS 자격증명이 아니라 LocalStack 관례상 더미값("test")을 쓰므로
# Secret 불필요 — YAML에 그대로 둬도 안전함.
#
# ■ 적용
#   kubectl apply -f localstack.yaml
#
# ■ 확인
#   kubectl get pods -n queuing-localstack
#   kubectl port-forward -n queuing-localstack svc/localstack 4566:4566
#   curl http://localhost:4566/_localstack/health
#
# ■ 파드 재시작 후 반드시 할 것 — SQS 큐 재생성
#   LocalStack은 데이터를 메모리에만 두므로 파드가 새로 뜨면 큐가 사라진다.
#   B파트(email-worker)의 KEDA 오토스케일링이 이 큐를 조회하므로,
#   재시작 때마다 아래 명령으로 다시 만들어줘야 한다.
#
#   kubectl exec -n queuing-localstack deploy/localstack -- \
#     awslocal sqs create-queue --queue-name resale-queue --region ap-northeast-2
#
#   확인:
#   kubectl exec -n queuing-localstack deploy/localstack -- \
#     awslocal sqs list-queues --region ap-northeast-2
#
#   ※ 리전을 명시하지 않으면 awslocal이 us-east-1에 만들어버린다.
#     LocalStack은 리전별로 큐를 따로 관리해서, KEDA가
#     awsRegion: ap-northeast-2로 조회하면 못 찾는다.
# ──────────────────────────────────────────────

apiVersion: v1
kind: Namespace
metadata:
  name: queuing-localstack
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: queuing-localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3
          ports:
            - containerPort: 4566
          env:
            # 팀이 실제로 쓰는 서비스만 활성화 — 다 켜면 시작이 느려지고 리소스만 더 먹음
            #   ses, sns : A파트(찬규) 알림 기능
            #   sqs      : B파트(건아) 재판매 워커 + KEDA 오토스케일링 트리거
            - name: SERVICES
              value: "sqs,ses,sns"
            - name: DEFAULT_REGION
              value: "ap-northeast-2"
            # awslocal CLI가 참조하는 값. DEFAULT_REGION만으로는 CLI가
            # us-east-1을 쓰기 때문에 리전이 어긋난다.
            - name: AWS_DEFAULT_REGION
              value: "ap-northeast-2"
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: queuing-localstack
spec:
  selector:
    app: localstack
  ports:
    - port: 4566
      targetPort: 4566
  type: ClusterIP
