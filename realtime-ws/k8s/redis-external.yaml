# A파트(찬규님) 백엔드가 아직 K8s 클러스터 밖(본인 로컬 PC)에서 돌고 있어서,
# 클러스터 내부 DNS(redis-master.realtime.svc.cluster.local)로는 접속이 안 됨.
# 기존 redis-master(ClusterIP) 서비스는 그대로 두고, 같은 pod를 가리키는
# NodePort 서비스를 하나 더 만들어서 클러스터 "밖"에서도 접속 가능하게 함.
#
# 적용: kubectl apply -f k8s/redis-external.yaml
# 확인: kubectl get svc redis-master-external -n realtime
#
# 찬규님 쪽 접속 정보 (.env 또는 환경변수):
#   REDIS_HOST=192.168.0.220   (마스터 노드 IP — 프론트가 이미 쓰고 있는 그 IP)
#   REDIS_PORT=30379
#
# 나중에 A파트도 K8s에 배포하기로 하면, 그때는 이 파일 삭제하고
# redis-master.realtime.svc.cluster.local을 직접 쓰면 됨 (더 안전하고 빠름).
apiVersion: v1
kind: Service
metadata:
  name: redis-master-external
  namespace: realtime
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: master
    app.kubernetes.io/instance: redis
    app.kubernetes.io/name: redis
  ports:
    - port: 6379
      targetPort: 6379
      nodePort: 30379
