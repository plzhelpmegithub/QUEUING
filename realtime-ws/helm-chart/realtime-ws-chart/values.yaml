replicaCount: 2

image:
  repository: "chlwldp/realtime-ws"
  tag: "v1.0.2"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8080
  nodePort: 30081

env:
  redisHost: "redis-master.realtime.svc.cluster.local"
  redisPort: "6379"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
