replicaCount: 2

image:
  repository: "chlwldp/realtime-ws"
  tag: "1.0.7"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8080
  nodePort: 30081

env:
  redisHost: "redis-master.realtime.svc.cluster.local"
  redisPort: "6379"

# ─────────────────────────────────────────────────────────────
# [D파트 통계 채널] 접속자 수·좋아요 수를 실시간으로 밀어주는 경로
#
# D파트(예지님)는 부하 격리를 위해 팀 공용 Redis 가 아닌 전용 인스턴스를 쓴다.
# 그쪽에 stats:{eventId} 로 발행된 집계값을 우리가 구독해서, 그 채널에 붙은
# 브라우저로 흘려보낸다. 집계는 D, 전송은 C 라는 역할 경계에 맞춘 구성이다.
#
#   브라우저:  wss://.../ws/stats/{eventId}?token=...
#   D파트:     PUBLISH stats:{eventId} '{"viewers":123,"likes":45}'
#
# enabled: false 이면 서버가 이 구독을 아예 만들지 않는다. D파트가 폴링(5초)로
# 운영하는 동안에는 꺼두면 되고, 그 상태에서 서버 동작은 지금까지와 동일하다.
#
# 켜기 전에 비밀번호 Secret 을 먼저 만들어야 한다:
#   kubectl -n realtime create secret generic stats-redis-secret \
#     --from-literal=password="$(kubectl -n redis get secret redis-counter-secret \
#        -o jsonpath='{.data.password}' | base64 -d)"
# ─────────────────────────────────────────────────────────────
statsRedis:
  enabled: true
  host: "redis-counter-master.redis.svc.cluster.local"
  port: "6379"
  secret:
    name: "stats-redis-secret"
    key: "password"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# ─────────────────────────────────────────────────────────────
# [ServiceMonitor] Prometheus 수집 설정
#
# releaseLabel 은 모니터링 스택의 헬름 릴리즈 이름과 반드시 같아야 한다.
# kube-prometheus-stack 의 Prometheus 가 "release: <이 값>" 라벨이 붙은
# ServiceMonitor 만 인식하기 때문이다. 틀리면 에러 없이 조용히 무시된다.
#
#   확인:  helm list -n monitoring   → NAME 칼럼
#
# 2026-09-08 기준 릴리즈 이름은 "monitoring" 이다.
# 예전 값 "kube-prom" 이 그대로 남아 있어서 ws_active_connections 가
# 한 번도 수집되지 않았고, 커스텀 메트릭 HPA 도 쓸 수 없었다.
# ─────────────────────────────────────────────────────────────
serviceMonitor:
  enabled: true
  releaseLabel: "monitoring"
  namespace: "" # 비우면 릴리즈 네임스페이스(realtime)에 만든다
  interval: 15s
