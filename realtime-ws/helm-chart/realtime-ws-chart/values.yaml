replicaCount: 2

image:
  repository: "chlwldp/realtime-ws"
  tag: "v1.0.4"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8080
  nodePort: 30081

env:
  redisHost: "redis-master.realtime.svc.cluster.local"
  redisPort: "6379"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# ─────────────────────────────────────────────────────────────
# [ServiceMonitor] Prometheus 수집 설정
#
# releaseLabel 은 모니터링 스택의 헬름 릴리즈 이름과 반드시 같아야 한다.
# kube-prometheus-stack 의 Prometheus 가 "release: <이 값>" 라벨이 붙은
# ServiceMonitor 만 인식하기 때문이다. 틀리면 에러 없이 조용히 무시된다.
#
#   확인:  helm list -n monitoring   → NAME 칼럼
#
# 2026-09-08 기준 릴리즈 이름은 "monitoring" 이다.
# 예전 값 "kube-prom" 이 그대로 남아 있어서 ws_active_connections 가
# 한 번도 수집되지 않았고, 커스텀 메트릭 HPA 도 쓸 수 없었다.
# ─────────────────────────────────────────────────────────────
serviceMonitor:
  enabled: true
  releaseLabel: "monitoring"
  namespace: "" # 비우면 릴리즈 네임스페이스(realtime)에 만든다
  interval: 15s
