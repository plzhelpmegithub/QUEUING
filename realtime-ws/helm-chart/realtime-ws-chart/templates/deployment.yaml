apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-ws
  namespace: realtime
  labels:
    app: realtime-ws
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: realtime-ws
  template:
    metadata:
      labels:
        app: realtime-ws
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: realtime-ws
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: REDIS_HOST
              value: {{ .Values.env.redisHost | quote }}
            - name: REDIS_PORT
              value: {{ .Values.env.redisPort | quote }}
            {{- if .Values.statsRedis.enabled }}
            # D파트 전용 Redis 의 stats:{eventId} 채널 구독용.
            # 이 값이 없으면 server.js 가 통계 구독을 아예 만들지 않는다.
            - name: STATS_REDIS_HOST
              value: {{ .Values.statsRedis.host | quote }}
            - name: STATS_REDIS_PORT
              value: {{ .Values.statsRedis.port | quote }}
            # D파트 Redis 는 requirepass 가 걸려 있어 비밀번호가 필수다.
            # 평문으로 두지 않고 Secret 에서 받는다.
            - name: STATS_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.statsRedis.secret.name | quote }}
                  key: {{ .Values.statsRedis.secret.key | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
