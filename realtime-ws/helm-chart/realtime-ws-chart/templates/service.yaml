apiVersion: v1
kind: Service
metadata:
  name: realtime-ws
  namespace: realtime
  labels:
    app: realtime-ws
spec:
  type: {{ .Values.service.type }}
  selector:
    app: realtime-ws
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.service.port }}
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
