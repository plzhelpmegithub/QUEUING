{{- if .Values.serviceMonitor.enabled }}
# ──────────────────────────────────────────────
# ServiceMonitor — Prometheus 가 이 서비스의 /metrics 를 긁어가게 한다.
#
# ■ release 라벨이 핵심이다
# kube-prometheus-stack 의 Prometheus 는 serviceMonitorSelector 로
# "release: <모니터링 헬름 릴리즈 이름>" 라벨이 붙은 ServiceMonitor 만 인식한다.
# 이 값이 틀리면 아무 에러도 없이 조용히 무시된다 — 리소스는 존재하고 문법도
# 맞는데 메트릭만 안 들어오는, 원인 찾기 어려운 상태가 된다.
#
# 실제로 2026-09-08 까지 이 라벨이 "kube-prom"(옛 릴리즈 이름)으로 남아 있어서
# ws_active_connections 가 Prometheus 에 한 번도 수집되지 않았고, 그 탓에
# prometheus-adapter 의 커스텀 메트릭 HPA 도 쓸 수 없었다.
#
# 릴리즈 이름 확인:  helm list -n monitoring
# ──────────────────────────────────────────────
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: realtime-ws
  namespace: {{ .Values.serviceMonitor.namespace | default .Release.Namespace }}
  labels:
    app: realtime-ws
    release: {{ .Values.serviceMonitor.releaseLabel }}
spec:
  # templates/service.yaml 의 Service 가 labels.app: realtime-ws 를 갖고,
  # 포트 이름이 http 이므로 아래 selector / endpoints 와 짝이 맞는다.
  selector:
    matchLabels:
      app: realtime-ws
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
