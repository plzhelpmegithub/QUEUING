server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 해시 라우터 — 모든 경로를 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 서버 프록시
    location ~ ^/(events|auth|queue|seats|event|admin|sse|reservations|membership|wishlist|cancel-queue) {
        proxy_pass http://api.queuing-a.svc.cluster.local:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 실시간 서버 프록시 (WebSocket)
    location ~ ^/(ws|rooms|publish|healthz|metrics) {
        proxy_pass http://realtime-ws.realtime.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
