server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA — 모든 프론트 경로를 index.html로
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 서버 (Fastify) — K8s 내부 서비스로 프록시
    location /events       { proxy_pass http://fastify-external:3000; }
    location /auth         { proxy_pass http://fastify-external:3000; }
    location /queue        { proxy_pass http://fastify-external:3000; }
    location /seats        { proxy_pass http://fastify-external:3000; }
    location /event        { proxy_pass http://fastify-external:3000; }
    location /admin        { proxy_pass http://fastify-external:3000; }
    location /sse          { proxy_pass http://fastify-external:3000; }
    location /reservations { proxy_pass http://fastify-external:3000; }
    location /membership   { proxy_pass http://fastify-external:3000; }
    location /wishlist     { proxy_pass http://fastify-external:3000; }

    # realtime-ws (채팅 + 좌석 WebSocket)
    location /ws {
        proxy_pass http://realtime-ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /rooms   { proxy_pass http://realtime-ws; }
    location /publish { proxy_pass http://realtime-ws; }
    location /healthz { proxy_pass http://realtime-ws; }
}
