spring.data.redis.host=redis-counter-master.redis.svc.cluster.local
spring.data.redis.port=6379
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
# Actuator 설정
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
# Micrometer Histogram 및 레이턴시 경로 추적 설정
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.9,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ===== D-Cloud MariaDB 연동 =====
# 환경변수 4개(DB_HOST/DB_PORT/DB_NAME/DB_USER)는 app-deployment.yaml에서 주입됨.
# 콜론 뒤 값은 환경변수가 없을 때 쓰는 기본값 — 로컬 빌드가 깨지지 않게 하기 위함.
spring.datasource.url=jdbc:mariadb://${DB_HOST:211.46.52.164}:${DB_PORT:13306}/${DB_NAME:queuing_db}
spring.datasource.username=${DB_USER:team2}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# 비밀번호는 여기 적지 않음.
# SPRING_DATASOURCE_PASSWORD 환경변수가 자동으로 spring.datasource.password에 매핑됨.

# DB에 못 붙어도 앱은 일단 뜨게 한다.
# 기본값이면 기동 중 커넥션 실패 시 앱이 아예 안 떠서 CrashLoop에 빠진다.
# Redis 기반 기능(접속자 수/혼잡도)은 DB 없이도 동작해야 하므로 -1로 둔다.
spring.datasource.hikari.initialization-fail-timeout=-1

# 파드 2개 x 5 = 최대 10개 커넥션.
# team2는 팀 공용 계정이라 다른 파트도 같은 DB를 쓰므로 작게 시작한다.
spring.datasource.hikari.maximum-pool-size=5
