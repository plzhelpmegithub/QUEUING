# ===== Redis 연결 =====
# 전용 Redis(redis 네임스페이스의 redis-counter-master)를 가리킨다.
# 비밀번호는 SPRING_DATA_REDIS_PASSWORD 환경변수로 주입되며,
# 값은 backend-counter-secret Secret의 redis-password 키에서 온다.
spring.data.redis.host=redis-counter-master.redis.svc.cluster.local
spring.data.redis.port=6379
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}

# ===== Actuator 설정 =====
# health : 쿠버네티스 probe와 Grafana 알람에서 사용
# prometheus : Prometheus가 15초 간격으로 긁어가는 엔드포인트
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# ===== Micrometer Histogram 및 레이턴시 경로 추적 =====
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.9,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# 1초 경계 버킷을 명시적으로 생성한다.
# 이 설정이 없으면 히스토그램에 +Inf 버킷만 생겨서
# "1초 이상 지연 경로 추이" 패널이 항상 0으로 표시된다.
management.metrics.distribution.slo.http.server.requests=1s

# ===== D-Cloud MariaDB 연동 =====
# 환경변수 4개(DB_HOST/DB_PORT/DB_NAME/DB_USER)는 app-deployment.yaml에서 주입된다.
# 콜론 뒤 값은 환경변수가 없을 때 쓰는 기본값 — 로컬 빌드가 깨지지 않게 하기 위함이다.
#
# useAffectedRows=true 가 필요한 이유:
#   MariaDB 드라이버의 기본값은 "조건에 걸린 행 수(found rows)"를 반환한다.
#   이 경우 INSERT ... ON DUPLICATE KEY UPDATE 가 중복이어서 아무것도 바꾸지 않았는데도 1을 돌려주고,
#   애플리케이션이 이를 "신규 등록"으로 오판해 Redis 카운터를 중복 증가시킨다.
#   실제로 변경된 행 수(affected rows)를 받아야 중복 여부를 판별할 수 있다.
spring.datasource.url=jdbc:mariadb://${DB_HOST:211.46.52.164}:${DB_PORT:13306}/${DB_NAME:queuing_db}?useAffectedRows=true
spring.datasource.username=${DB_USER:team2}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# 비밀번호는 여기 적지 않는다.
# SPRING_DATASOURCE_PASSWORD 환경변수가 자동으로 spring.datasource.password에 매핑된다.

# DB에 못 붙어도 앱은 일단 뜨게 한다.
# 기본값이면 기동 중 커넥션 실패 시 앱이 아예 안 떠서 CrashLoop에 빠진다.
# Redis 기반 기능(접속자 수/혼잡도)은 DB 없이도 동작해야 하므로 -1로 둔다.
spring.datasource.hikari.initialization-fail-timeout=-1

# 파드 2개 x 5 = 최대 10개 커넥션.
# team2는 팀 공용 계정이라 다른 파트도 같은 DB를 쓰므로 작게 시작한다.
spring.datasource.hikari.maximum-pool-size=5
