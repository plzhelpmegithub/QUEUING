# =============================================================================
# QUEUING API 백엔드 — Helm values.yaml
# =============================================================================
# Redis 기반 예매/대기열/인증 API 서버의 쿠버네티스 배포 설정.
# 이 파일의 값들은 templates/ 디렉토리의 YAML 템플릿에 주입되어
# 최종 쿠버네티스 매니페스트를 생성한다.
# =============================================================================

# -----------------------------------------------------------------------------
# [레플리카 수] 동시에 실행할 파드(Pod) 개수.
# 부하 분산과 가용성을 위해 2개 이상 권장. autoscaling이 enabled면 이 값은 무시됨.
# -----------------------------------------------------------------------------
replicaCount: 2

# -----------------------------------------------------------------------------
# [컨테이너 이미지] 파드에서 실행할 Docker 이미지 설정.
#   repository : 이미지 저장소 주소 (Docker Hub 또는 프라이빗 레지스트리)
#   pullPolicy : 이미지 가져오기 정책
#                - IfNotPresent: 로컬에 있으면 다시 안 받음 (기본, 트래픽 절약)
#                - Always: 매번 최신 이미지를 받음 (개발 환경에서 유용)
#   tag        : 이미지 태그 (버전). Chart.yaml의 appVersion이 기본 fallback.
# -----------------------------------------------------------------------------
image:
  repository: "mover14/redis-api-backend"
  pullPolicy: IfNotPresent
  tag: "1.0.1"

# -----------------------------------------------------------------------------
# [이미지 풀 시크릿] 프라이빗 레지스트리 인증이 필요할 때 사용.
# 예: imagePullSecrets: [{ name: "harbor-cred" }]
# 퍼블릭 Docker Hub를 쓰면 비워둔다.
# -----------------------------------------------------------------------------
imagePullSecrets: []

# -----------------------------------------------------------------------------
# [이름 오버라이드] 헬름 릴리즈 이름 대신 사용할 커스텀 이름.
# 보통 비워두면 "릴리즈이름-redis-api-chart" 형태로 자동 생성됨.
# -----------------------------------------------------------------------------
nameOverride: "api"
fullnameOverride: "api"

# -----------------------------------------------------------------------------
# [서비스 어카운트] 파드가 K8s API에 접근할 때 사용하는 인증 주체.
#   create    : true면 헬름이 자동 생성. 이미 만들어둔 SA를 쓸 때는 false.
#   automount : true면 파드에 SA 토큰을 자동 마운트 (K8s API 호출 시 필요).
#   name      : 비워두면 fullname 기반 자동 생성.
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# -----------------------------------------------------------------------------
# [파드 메타데이터] 파드에 추가할 어노테이션과 라벨.
#   podAnnotations : Prometheus 스크래핑, Istio 사이드카 설정 등에 사용.
#   podLabels      : 커스텀 라벨 추가 (모니터링 셀렉터 등).
# -----------------------------------------------------------------------------
podAnnotations: {}
podLabels: {}

# -----------------------------------------------------------------------------
# [보안 컨텍스트] 파드/컨테이너 수준의 보안 설정.
#   podSecurityContext : 파드 전체에 적용 (fsGroup, runAsUser 등).
#   securityContext    : 개별 컨테이너에 적용 (readOnlyRootFilesystem 등).
# 프로덕션에서는 최소 권한 원칙(non-root 실행 등) 적용 권장.
# -----------------------------------------------------------------------------
podSecurityContext: {}
securityContext: {}

# -----------------------------------------------------------------------------
# [서비스(Service)] 파드를 클러스터 내/외부에 노출하는 네트워크 설정.
#   type     : NodePort = 클러스터 노드의 고정 포트로 외부 접근 가능.
#              ClusterIP = 클러스터 내부에서만 접근 (기본값).
#              LoadBalancer = 클라우드 LB 자동 프로비저닝.
#   port     : 파드 내부에서 앱이 리슨하는 포트 (Dockerfile EXPOSE 3000).
#   nodePort : NodePort 타입일 때 외부에서 접근할 포트 (30000~32767 범위).
#              → 마스터노드IP:30090 으로 API 서버 접근 가능.
# -----------------------------------------------------------------------------
service:
  type: NodePort
  port: 3000
  nodePort: 30084


# -----------------------------------------------------------------------------
# [환경변수] 컨테이너에 주입되는 환경변수.
# 앱 코드(redis.js, mariadb.js, notificationService.js 등)가 참조하는 값들.
# 클러스터 내부 서비스 DNS 형식: <서비스명>.<네임스페이스>.svc.cluster.local
# -----------------------------------------------------------------------------
env:
  # --- Redis 연결 (redis.js / timerService.js) ---
  # C파트(지예님)가 realtime 네임스페이스에 배포한 Redis 마스터.
  # 대기열, 좌석 상태, 이벤트 캐시 등 실시간 데이터 저장소.
  redisHost: "redis-master.realtime.svc.cluster.local"
  redisPort: "6379"

  # --- MariaDB 연결 (mariadb.js) ---
  # shared-infra/mariadb.yaml로 배포된 MariaDB (네임스페이스: queuing-db).
  # 회원 정보, 예매 내역 등 영속적 데이터 저장.
  dbHost: "192.168.0.191"
  dbPort: "3306"
  dbUser: "root"
  dbName: "queuing_db"

  # --- AWS LocalStack (notificationService.js) ---
  # SES/SNS 이메일·푸시 알림용. 온프레미스에서는 LocalStack으로 대체.
  # AWS_ENDPOINT를 안 넣으면 알림 기능이 100% 실패하므로 반드시 설정.
  # 자격증명은 LocalStack 관례상 더미값("test") 사용.
  awsEndpoint: "http://localstack.queuing-localstack.svc.cluster.local:4566"
  awsAccessKeyId: "test"
  awsSecretAccessKey: "test"

  # --- Node.js 실행 환경 ---
  # "production"이면 디버그 로그 축소, 에러 스택트레이스 숨김 등 최적화 적용.
  nodeEnv: "production"
  nodeOptions: "--max-old-space-size=400" # Node.js V8 힙 메모리 고갈로 인한 파드 부하시 프로세스 죽음 현상 해결

# -----------------------------------------------------------------------------
# [DB 비밀번호 시크릿] 평문 커밋 방지를 위해 K8s Secret으로 분리.
# 배포 전에 아래 명령으로 시크릿을 먼저 생성해야 함:
#   kubectl create secret generic mariadb-credentials \
#     -n <이 차트가 배포되는 네임스페이스> \
#     --from-literal=MARIADB_ROOT_PASSWORD='<실제 비밀번호>'
# -----------------------------------------------------------------------------
dbPasswordSecret:
  name: "mariadb-credentials"
  key: "MARIADB_ROOT_PASSWORD"

# -----------------------------------------------------------------------------
# [리소스 제한] 파드의 CPU/메모리 할당량.
#   requests : 스케줄링 시 보장받을 최소 리소스. 이 값 기준으로 노드에 배치.
#   limits   : 절대 초과할 수 없는 상한. 초과하면 CPU는 쓰로틀링, 메모리는 OOMKill.
#
# 현재 설정: CPU 100m~500m (0.1~0.5 코어), 메모리 128Mi~512Mi.
# 부하 테스트 결과에 따라 조정 필요.
# -----------------------------------------------------------------------------
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# -----------------------------------------------------------------------------
# [Liveness Probe] 컨테이너가 살아있는지 주기적으로 확인.
# 실패하면 K8s가 컨테이너를 강제 재시작(kill → restart).
#
#   httpGet             : GET /health 요청으로 헬스체크 (200 응답이면 정상).
#   initialDelaySeconds : 컨테이너 시작 후 첫 체크까지 대기 시간.
#                         → 30초: Node.js 앱 초기화(Redis/DB 연결 등) 완료 대기.
#   periodSeconds       : 체크 주기 (15초마다 한 번씩 확인).
#   timeoutSeconds      : 응답 대기 시간. 이 시간 내에 응답 없으면 실패로 간주.
#                         → 5초: 부하 시 /health 응답이 느려질 수 있으므로 넉넉하게.
#                         (기존 1초 기본값이 50명 부하에서도 타임아웃 → 억울한 재시작 유발)
#   failureThreshold    : 연속 실패 허용 횟수. 3번 연속 실패해야 재시작.
#                         → 일시적 지연은 무시하고, 진짜 장애만 잡음.
# -----------------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

# -----------------------------------------------------------------------------
# [Readiness Probe] 컨테이너가 트래픽을 받을 준비가 됐는지 확인.
# 실패하면 Service의 엔드포인트에서 제외 (트래픽 안 보냄). 재시작은 안 함.
#
#   initialDelaySeconds : 15초: liveness보다 빠르게 시작해서 빠른 서비스 투입 시도.
#   periodSeconds       : 10초마다 확인.
#   timeoutSeconds      : 5초: liveness와 동일하게 넉넉한 타임아웃.
#   failureThreshold    : 3번 연속 실패하면 트래픽 차단. 복구되면 자동 재투입.
#
# ※ Liveness vs Readiness 차이:
#   - Liveness 실패 → 파드 죽이고 재시작 (심각한 장애)
#   - Readiness 실패 → 트래픽만 차단, 파드는 유지 (일시적 과부하)
# -----------------------------------------------------------------------------
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# -----------------------------------------------------------------------------
# [오토스케일링 (HPA)] CPU 사용률에 따라 파드 수를 자동 조절.
#   enabled                      : true면 HPA 리소스 생성. replicaCount는 무시됨.
#   minReplicas / maxReplicas    : 최소/최대 파드 수.
#   targetCPUUtilizationPercentage : 이 비율 초과 시 스케일 아웃.
#                                    70% = CPU 70% 넘으면 파드 추가.
#
# 현재 비활성화 — 온프레미스 클러스터 리소스가 제한적이므로 수동 관리.
# 부하 테스트 후 필요 시 활성화.
# -----------------------------------------------------------------------------
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# -----------------------------------------------------------------------------
# [볼륨] 파드에 마운트할 외부 스토리지.
# 예: 로그 파일 영속화, 설정 파일 ConfigMap 마운트 등.
# 현재 API 서버는 스테이트리스이므로 볼륨 불필요.
# -----------------------------------------------------------------------------
volumes: []
volumeMounts: []

# -----------------------------------------------------------------------------
# [노드 스케줄링] 파드를 특정 노드에 배치하기 위한 제약 조건.
#   nodeSelector : 라벨 기반 노드 선택 (예: disktype: ssd).
#   tolerations  : 특정 taint가 있는 노드에도 배치 허용.
#   affinity     : 노드/파드 친화성 규칙 (고급 스케줄링).
# 현재 기본값(제약 없음) — 클러스터의 아무 워커 노드에 배치.
# -----------------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}
