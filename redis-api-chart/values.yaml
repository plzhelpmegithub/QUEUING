# =============================================================================
# QUEUING API 백엔드 — Helm values.yaml
# =============================================================================
# Redis 기반 예매/대기열/인증 API 서버의 쿠버네티스 배포 설정.
# 이 파일의 값들은 templates/ 디렉토리의 YAML 템플릿에 주입되어
# 최종 쿠버네티스 매니페스트를 생성한다.
# =============================================================================

# -----------------------------------------------------------------------------
# [레플리카 수] 동시에 실행할 파드(Pod) 개수.
# 부하 분산과 가용성을 위해 2개 이상 권장. autoscaling이 enabled면 이 값은 무시됨.
# -----------------------------------------------------------------------------
replicaCount: 2

# -----------------------------------------------------------------------------
# [컨테이너 이미지] 파드에서 실행할 Docker 이미지 설정.
#   repository : 이미지 저장소 주소 (Docker Hub 또는 프라이빗 레지스트리)
#   pullPolicy : 이미지 가져오기 정책
#                - IfNotPresent: 로컬에 있으면 다시 안 받음 (기본, 트래픽 절약)
#                - Always: 매번 최신 이미지를 받음 (개발 환경에서 유용)
#   tag        : 이미지 태그 (버전). Chart.yaml의 appVersion이 기본 fallback.
# -----------------------------------------------------------------------------
image:
  repository: "mover14/redis-api-backend"
  pullPolicy: IfNotPresent
  tag: "2.2.6"

# -----------------------------------------------------------------------------
# [이미지 풀 시크릿] 프라이빗 레지스트리 인증이 필요할 때 사용.
# 예: imagePullSecrets: [{ name: "harbor-cred" }]
# 퍼블릭 Docker Hub를 쓰면 비워둔다.
# -----------------------------------------------------------------------------
imagePullSecrets: []

# -----------------------------------------------------------------------------
# [이름 오버라이드] 헬름 릴리즈 이름 대신 사용할 커스텀 이름.
# 보통 비워두면 "릴리즈이름-redis-api-chart" 형태로 자동 생성됨.
# -----------------------------------------------------------------------------
nameOverride: "api"
fullnameOverride: "api"

# -----------------------------------------------------------------------------
# [서비스 어카운트] 파드가 K8s API에 접근할 때 사용하는 인증 주체.
#   create    : true면 헬름이 자동 생성. 이미 만들어둔 SA를 쓸 때는 false.
#   automount : true면 파드에 SA 토큰을 자동 마운트 (K8s API 호출 시 필요).
#   name      : 비워두면 fullname 기반 자동 생성.
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# -----------------------------------------------------------------------------
# [파드 메타데이터] 파드에 추가할 어노테이션과 라벨.
#   podAnnotations : Prometheus 스크래핑, Istio 사이드카 설정 등에 사용.
#   podLabels      : 커스텀 라벨 추가 (모니터링 셀렉터 등).
# -----------------------------------------------------------------------------
podAnnotations: {}
podLabels: {}

# -----------------------------------------------------------------------------
# [보안 컨텍스트] 파드/컨테이너 수준의 보안 설정.
#   podSecurityContext : 파드 전체에 적용 (fsGroup, runAsUser 등).
#   securityContext    : 개별 컨테이너에 적용 (readOnlyRootFilesystem 등).
# 프로덕션에서는 최소 권한 원칙(non-root 실행 등) 적용 권장.
# -----------------------------------------------------------------------------
podSecurityContext: {}
securityContext: {}

# -----------------------------------------------------------------------------
# [서비스(Service)] 파드를 클러스터 내/외부에 노출하는 네트워크 설정.
#   type     : NodePort = 클러스터 노드의 고정 포트로 외부 접근 가능.
#              ClusterIP = 클러스터 내부에서만 접근 (기본값).
#              LoadBalancer = 클라우드 LB 자동 프로비저닝.
#   port     : 파드 내부에서 앱이 리슨하는 포트 (Dockerfile EXPOSE 3000).
#   nodePort : NodePort 타입일 때 외부에서 접근할 포트 (30000~32767 범위).
#              → 마스터노드IP:30090 으로 API 서버 접근 가능.
# -----------------------------------------------------------------------------
service:
  type: NodePort
  port: 3000
  nodePort: 30084


# -----------------------------------------------------------------------------
# [환경변수] 컨테이너에 주입되는 환경변수.
# 앱 코드(redis.js, mariadb.js, notificationService.js 등)가 참조하는 값들.
# 클러스터 내부 서비스 DNS 형식: <서비스명>.<네임스페이스>.svc.cluster.local
# -----------------------------------------------------------------------------
env:
  # --- Redis 연결 (redis.js / timerService.js) ---
  # 대기열, 좌석 상태, 이벤트 캐시 등 실시간 데이터 저장소.
  # AWS 운영용 실제 엔드포인트는 argocd/values-prod.yaml에서 마지막에
  # override한다. 아래 값은 기존 차트 단독 렌더링/호환성을 위한 공통값이다.
  redisHost: "queuing-redis.wxbnsp.ng.0001.apn2.cache.amazonaws.com"
  redisPort: "6379"

  # --- 자동 승인 워커 ---
  # true이면 admitted 풀의 빈 슬롯만큼, 최대 BATCH_SIZE명을 주기적으로 자동 승인한다.
  # 운영에서는 false를 유지하고, 실제 대기열 운영 정책에 맞춰 별도 검토한다.
  autoAdmissionEnabled: true
  autoAdmissionIntervalMs: "1000"

  # --- Final 취소표 시뮬레이션 ---
  # A파트의 로컬 검증 전용 공용 좌석 풀·Gmail 링크 라우트 활성화 여부.
  # 운영 AWS에서는 false로 유지해 /admin/last-simulation, /last-simulation 라우트와
  # 전용 테이블 초기화·만료 스위퍼를 등록하지 않는다.
  lastSimulationEnabled: false

  # --- 승인 풀/만료 정책 ---
  # admitted 상태로 유지할 수 있는 최대 사용자 수.
  # 자동 승인 워커와 수동 /queue/admit 모두 이 값을 사용한다.
  batchSize: "100"
  # Admission Token 발급 후 승인 상태를 유지하는 제한시간(초).
  admissionTimeout: "420"
  # 승인 만료 여부를 확인하는 주기(밀리초).
  admissionTimeoutCheckIntervalMs: "1000"

  # --- 관계형 DB 연결 (mariadb.js) ---
  # 회원 정보, 예매 내역 등 영속적 데이터 저장.
  # 현재 AWS 배포 대상은 EKS에서 접근하는 RDS MariaDB다.
  # 온프레미스/D-Cloud로 되돌릴 때는 별도 local values override를 사용한다.
  dbHost: "queuing-mariadb-proxy.proxy-cto8u6c4yxyv.ap-northeast-2.rds.amazonaws.com"
  dbPort: "3306"
  dbUser: "team2"
  dbName: "queuing_db"

  # --- AWS SES / LocalStack (notificationService.js) ---
  # SES 이메일 발송용. 온프레미스에서는 LocalStack(awsEndpoint)으로 대체.
  # AWS 환경에서는 awsEndpoint를 비워두면 실제 SES를 사용한다.
  # 자격증명이 비어 있으면 IRSA(ServiceAccount 역할)로 인증한다.
  awsEndpoint: ""
  awsAccessKeyId: ""
  awsSecretAccessKey: ""

  # --- SES 발신자 주소 ---
  # SES에서 검증된 이메일 또는 도메인이어야 발송 가능.
  # 비워두면 SMTP_USER → 'noreply@queuing.com' 순서로 폴백한다.
  fromEmail: "noreply@queuing.kr"

  # --- 사이트 URL (취소표 알림 이메일 내 링크) ---
  # 비워두면 http://localhost 로 폴백하여 이메일 링크가 깨진다.
  siteUrl: "https://www.queuing.kr"

  # --- B파트 연동 ---
  # SQS 취소 이벤트 큐 URL과 B파트 콜백 API base 주소.
  # 설정하면 /verify-link 요청은 ${base}/b-callback/verify-link로 전달된다.
  cancellationEventsQueueUrl: "https://sqs.ap-northeast-2.amazonaws.com/230790682749/queuing-cancellation-events"
  bCallbackBaseUrl: "https://api.queuing.kr"
  # 콜백 인증 시크릿은 Kubernetes Secret에서 주입.
  # bCallbackSecret은 values에 직접 기록하지 않는다.

  # --- Node.js 실행 환경 ---
  # "production"이면 디버그 로그 축소, 에러 스택트레이스 숨김 등 최적화 적용.
  nodeEnv: "production"
  nodeOptions: "--max-old-space-size=400" # Node.js V8 힙 메모리 고갈로 인한 파드 부하시 프로세스 죽음 현상 해결

# -----------------------------------------------------------------------------
# [B파트 콜백 인증] B_CALLBACK_SECRET을 Kubernetes Secret에서 주입한다.
# 활성화하려면 아래 블록의 주석을 해제하고 Secret을 생성한다.
#   kubectl -n queuing-a create secret generic b-callback-credentials \
#     --from-literal=B_CALLBACK_SECRET='<32자 이상 랜덤 값>'
# -----------------------------------------------------------------------------
bCallbackAuth:
  secret:
    name: "b-callback-credentials"
    key: "B_CALLBACK_SECRET"

# -----------------------------------------------------------------------------
# [SMTP 이메일 발송] Gmail 등 외부 SMTP를 사용할 때의 비밀정보 주입 설정.
# enabled가 false이면 기존 AWS SES/LocalStack fallback을 그대로 사용한다.
# true로 바꾸기 전에 아래 Secret을 queuing-a 네임스페이스에 생성해야 한다.
#   kubectl -n queuing-a create secret generic gmail-smtp-credentials \
#     --from-env-file=.secrets/gmail-smtp.env
#
# gmail-smtp.env에는 SMTP_USER와 SMTP_PASS만 보관하며, 실제 파일은 Git에 커밋하지 않는다.
# SMTP_PASS에는 Gmail 계정 비밀번호가 아닌 Gmail App Password를 사용한다.
# -----------------------------------------------------------------------------
smtp:
  enabled: false
  host: "smtp.gmail.com"
  port: "587"
  # 비워두면 API가 SMTP_USER를 발신자 주소로 사용한다.
  fromEmail: ""
  secret:
    name: "gmail-smtp-credentials"
    userKey: "SMTP_USER"
    passwordKey: "SMTP_PASS"

# -----------------------------------------------------------------------------
# [DB 비밀번호 시크릿] 평문 커밋 방지를 위해 K8s Secret으로 분리.
# RDS 비밀번호는 queuing-a/app-secrets의 RDS_PASSWORD 키에서 주입한다.
# AWS Secrets Manager 원본은 External Secrets Operator 또는 CSI 동기화가 필요하다.
# -----------------------------------------------------------------------------
dbPasswordSecret:
  name: "app-secrets"
  key: "RDS_PASSWORD"

# -----------------------------------------------------------------------------
# [API 인증 Secret] 세션 JWT와 대기열 Admission Token의 서명 키.
# 두 키는 용도가 다르므로 같은 값을 재사용하지 않는다.
# 배포 전에 queuing-a 네임스페이스에 Secret을 생성해야 한다:
#   kubectl -n queuing-a create secret generic auth-credentials \
#     --from-literal=JWT_AUTH_SECRET='<세션용 랜덤 키>' \
#     --from-literal=JWT_SECRET='<Admission Token용 랜덤 키>'
# -----------------------------------------------------------------------------
auth:
  secret:
    name: "auth-credentials"
    accessKey: "JWT_AUTH_SECRET"
    admissionKey: "JWT_SECRET"
  # true일 때만 아래 Secret에서 초기 관리자/모니터링 계정을 생성한다.
  # 비밀번호는 코드나 values.yaml에 기록하지 않는다.
  bootstrap:
    enabled: false
    secret:
      name: "auth-bootstrap-credentials"
      adminUserKey: "ADMIN_BOOTSTRAP_USER"
      adminPasswordKey: "ADMIN_BOOTSTRAP_PASSWORD"
      monitorUserKey: "MONITOR_BOOTSTRAP_USER"
      monitorPasswordKey: "MONITOR_BOOTSTRAP_PASSWORD"

# -----------------------------------------------------------------------------
# [Google reCAPTCHA] API 요청 봇 검증 설정 (v3 + v2 체크박스 폴백).
# enabled가 false이면 기존 배포처럼 reCAPTCHA 환경변수를 파드에 주입하지 않는다.
# true로 바꾸면 아래 Secret이 queuing-a 네임스페이스에 미리 존재해야 한다.
# Secret에는 v3 Secret Key와 v2 Secret Key를 함께 보관한다.
# 운영 환경에서는 allowedHostnames를 실제 프론트엔드 도메인으로 변경한다.
#
# v2Fallback: true이면 v3 점수 미달 시 v2 체크박스로 폴백한다.
#   이때 Secret에 RECAPTCHA_V2_SECRET_KEY 키가 존재해야 한다.
#   false이면 v2 관련 환경변수를 주입하지 않으며 v3 검증만 사용한다.
# -----------------------------------------------------------------------------
recaptcha:
  enabled: false
  required: false
  scoreThreshold: "0.5"
  allowedHostnames: "queuing.kr,www.queuing.kr"
  v2Fallback: false
  secret:
    name: "recaptcha-credentials"
    v3Key: "RECAPTCHA_SECRET_KEY"
    v2Key: "RECAPTCHA_V2_SECRET_KEY"

# -----------------------------------------------------------------------------
# [리소스 제한] 파드의 CPU/메모리 할당량.
#   requests : 스케줄링 시 보장받을 최소 리소스. 이 값 기준으로 노드에 배치.
#   limits   : 절대 초과할 수 없는 상한. 초과하면 CPU는 쓰로틀링, 메모리는 OOMKill.
#
# 현재 설정: CPU 100m~500m (0.1~0.5 코어), 메모리 128Mi~512Mi.
# 부하 테스트 결과에 따라 조정 필요.
# -----------------------------------------------------------------------------
resources:
  requests:
    cpu: "500m"
    memory: "128Mi"
  limits:
    cpu: "1000m"
    memory: "512Mi"

# -----------------------------------------------------------------------------
# [Liveness Probe] 컨테이너가 살아있는지 주기적으로 확인.
# 실패하면 K8s가 컨테이너를 강제 재시작(kill → restart).
#
#   httpGet             : GET /health 요청으로 헬스체크 (200 응답이면 정상).
#   initialDelaySeconds : 컨테이너 시작 후 첫 체크까지 대기 시간.
#                         → 30초: Node.js 앱 초기화(Redis/DB 연결 등) 완료 대기.
#   periodSeconds       : 체크 주기 (15초마다 한 번씩 확인).
#   timeoutSeconds      : 응답 대기 시간. 이 시간 내에 응답 없으면 실패로 간주.
#                         → 5초: 부하 시 /health 응답이 느려질 수 있으므로 넉넉하게.
#                         (기존 1초 기본값이 50명 부하에서도 타임아웃 → 억울한 재시작 유발)
#   failureThreshold    : 연속 실패 허용 횟수. 3번 연속 실패해야 재시작.
#                         → 일시적 지연은 무시하고, 진짜 장애만 잡음.
# -----------------------------------------------------------------------------
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 8
  failureThreshold: 3

# -----------------------------------------------------------------------------
# [Readiness Probe] 컨테이너가 트래픽을 받을 준비가 됐는지 확인.
# 실패하면 Service의 엔드포인트에서 제외 (트래픽 안 보냄). 재시작은 안 함.
#
#   initialDelaySeconds : 15초: liveness보다 빠르게 시작해서 빠른 서비스 투입 시도.
#   periodSeconds       : 10초마다 확인.
#   timeoutSeconds      : 5초: liveness와 동일하게 넉넉한 타임아웃.
#   failureThreshold    : 3번 연속 실패하면 트래픽 차단. 복구되면 자동 재투입.
#
# ※ Liveness vs Readiness 차이:
#   - Liveness 실패 → 파드 죽이고 재시작 (심각한 장애)
#   - Readiness 실패 → 트래픽만 차단, 파드는 유지 (일시적 과부하)
# -----------------------------------------------------------------------------
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# -----------------------------------------------------------------------------
# [오토스케일링 (HPA)] CPU 사용률에 따라 파드 수를 자동 조절.
#   enabled                      : true면 HPA 리소스 생성. replicaCount는 무시됨.
#   minReplicas / maxReplicas    : 최소/최대 파드 수.
#   targetCPUUtilizationPercentage : 이 비율 초과 시 스케일 아웃.
#                                    70% = CPU 70% 넘으면 파드 추가.
#
# 현재 비활성화 — 온프레미스 클러스터 리소스가 제한적이므로 수동 관리.
# 부하 테스트 후 필요 시 활성화.
# -----------------------------------------------------------------------------
autoscaling:
  enabled: true
  minReplicas: 4
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# -----------------------------------------------------------------------------
# [볼륨] 파드에 마운트할 외부 스토리지.
# 예: 로그 파일 영속화, 설정 파일 ConfigMap 마운트 등.
# 현재 API 서버는 스테이트리스이므로 볼륨 불필요.
# -----------------------------------------------------------------------------
volumes: []
volumeMounts: []

# -----------------------------------------------------------------------------
# [노드 스케줄링] 파드를 특정 노드에 배치하기 위한 제약 조건.
#   nodeSelector : 라벨 기반 노드 선택 (예: disktype: ssd).
#   tolerations  : 특정 taint가 있는 노드에도 배치 허용.
#   affinity     : 노드/파드 친화성 규칙 (고급 스케줄링).
# 현재 기본값(제약 없음) — 클러스터의 아무 워커 노드에 배치.
# -----------------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}

# -----------------------------------------------------------------------------
# [Prometheus 메트릭] prom-client가 노출하는 /metrics 엔드포인트 수집 설정.
#
# (1) Annotation 기반 디스커버리 (metrics.enabled: true)
#     → Pod에 prometheus.io/* 어노테이션을 자동 추가.
#     → 독립 Prometheus EC2든 클러스터 내 Prometheus든,
#       kubernetes_sd_configs + relabel로 어노테이션 기반 자동 스크래핑 가능.
#
# (2) ServiceMonitor CRD (metrics.serviceMonitor.enabled: true)
#     → kube-prometheus-stack(Prometheus Operator)이 설치된 클러스터에서 사용.
#     → ServiceMonitor 리소스가 생성되어 Prometheus가 자동으로 타겟 등록.
#     → Grafana 통합 대시보드에 queuing_* 메트릭이 바로 표시됨.
#
# 두 방식은 독립적으로 사용할 수도 있고, 동시에 켤 수도 있다.
# -----------------------------------------------------------------------------
metrics:
  enabled: true
  path: "/metrics"
  serviceMonitor:
    enabled: true
    namespace: ""
    interval: "15s"
    scrapeTimeout: "10s"
    # Prometheus Operator의 serviceMonitorSelector에 매칭되어야 하는 추가 라벨.
    # 클러스터의 Prometheus 릴리즈 이름과 일치해야 수집됨.
    labels:
      release: monitoring
