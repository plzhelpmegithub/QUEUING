replicaCount: 2

image:
  # 온프레미스 프라이빗 레지스트리 주소로 변경 (예: harbor.내부도메인/queuing/backend)
  repository: "mover14/redis-api-backend"
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: NodePort
  port: 3000        # 파드 내부 포트 (Dockerfile EXPOSE 3000)
  nodePort: 30090   # 조장PC_IP:30090 으로 외부 접근 (30000~32767 범위)

ingress:
  enabled: false

httpRoute:
  enabled: false

# 앱 코드 기준 환경변수 — 지예님 클러스터에 실제로 떠있는 서비스명 기준으로 수정함
# (redis-service.redis / mariadb-service.default는 실재하지 않는 이름이었음 — 존재하는
#  서비스로 교체: shared-infra/mariadb.yaml, 지예님이 이미 운영 중인 redis-master)
env:
  # redis.js / timerService.js — 지예님(C파트) Redis로 통합, A_REDIS_HOST 별도 불필요해짐
  redisHost: "redis-master.realtime.svc.cluster.local"
  redisPort: "6379"
  # mariadb.js — shared-infra/mariadb.yaml로 배포되는 MariaDB (namespace: queuing-db)
  dbHost: "mariadb.queuing-db.svc.cluster.local"
  dbPort: "3306"
  dbUser: "root"
  dbName: "queuing_db"
  # notificationService.js (SES/SNS, LocalStack) — shared-infra/localstack.yaml
  # AWS_ENDPOINT 등에 기본값(fallback)이 최근 커밋에서 제거돼서, 이제 안 넣으면
  # 알림 기능이 100% 실패함. LocalStack은 진짜 자격증명이 아니라 관례상 더미값 사용.
  awsEndpoint: "http://localstack.queuing-localstack.svc.cluster.local:4566"
  awsAccessKeyId: "test"
  awsSecretAccessKey: "test"
  # Node 환경
  nodeEnv: "production"

# DB 비밀번호는 평문 커밋 대신 Secret으로 분리.
# 배포 전 본인 네임스페이스에 먼저 생성 필요:
#   kubectl create secret generic mariadb-credentials -n <이 차트가 배포되는 네임스페이스> \
#     --from-literal=MARIADB_ROOT_PASSWORD='<지예님께 전달받은 비밀번호>'
dbPasswordSecret:
  name: "mariadb-credentials"
  key: "MARIADB_ROOT_PASSWORD"

# 온프레미스 파드 리소스 제한 (클러스터 용량에 맞게 조정)
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
