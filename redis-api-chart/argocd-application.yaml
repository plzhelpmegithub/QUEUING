apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: <Git 저장소 URL>
    targetRevision: HEAD
    path: <차트 경로>  # 예: QUEUING/redis-api-chart
  destination:
    server: https://kubernetes.default.svc
    namespace: queuing-a
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
