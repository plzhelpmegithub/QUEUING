# =============================================================================
# [Service] 파드 그룹에 대한 안정적인 네트워크 엔드포인트 제공.
# 파드 IP는 재시작 시 바뀌지만, Service는 고정된 ClusterIP/NodePort로
# 항상 동일한 주소로 접근 가능. 셀렉터로 매칭되는 파드에 트래픽을 로드밸런싱.
#
# NodePort 타입: 클러스터 외부에서 <노드IP>:<nodePort>로 직접 접근 가능.
# → 현재 마스터노드IP:30090 으로 API 서버 접근.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis-api-chart.fullname" . }}
  namespace: queuing-a
  labels:
    {{- include "redis-api-chart.labels" . | nindent 4 }}
  {{- if .Values.metrics.enabled }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.service.port | quote }}
    prometheus.io/path: {{ .Values.metrics.path | default "/metrics" | quote }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}        # Service가 클러스터 내부에서 리슨하는 포트
      targetPort: http                         # 파드 컨테이너의 포트 이름 (deployment의 ports.name)
      protocol: TCP
      name: http
      # NodePort 타입일 때 외부 노출 포트 (30000~32767)
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  # 이 라벨을 가진 파드에만 트래픽 전달
  selector:
    {{- include "redis-api-chart.selectorLabels" . | nindent 4 }}
