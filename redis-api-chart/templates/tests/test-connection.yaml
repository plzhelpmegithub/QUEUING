# =============================================================================
# [Helm Test] 배포 후 서비스 연결 테스트용 임시 파드.
# `helm test <릴리즈명>` 명령으로 실행.
# busybox의 wget으로 Service 엔드포인트에 접속 시도 → 성공하면 테스트 통과.
# 테스트 완료 후 파드는 자동 종료 (restartPolicy: Never).
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "redis-api-chart.fullname" . }}-test-connection"
  labels:
    {{- include "redis-api-chart.labels" . | nindent 4 }}
  annotations:
    # helm.sh/hook: test → helm test 시에만 생성되는 리소스
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      # Service의 ClusterIP:port로 HTTP 요청 테스트
      command: ['wget']
      args: ['{{ include "redis-api-chart.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
