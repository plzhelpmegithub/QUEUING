{{- if .Values.serviceAccount.create -}}
# =============================================================================
# [ServiceAccount] 파드가 K8s API와 통신할 때 사용하는 인증 주체.
# 파드 내부에서 kubectl 명령이나 K8s API를 호출할 때 이 SA의 권한으로 실행됨.
# RBAC(Role-Based Access Control)과 함께 사용하여 최소 권한 원칙 적용 가능.
#
# serviceAccount.create: true 일 때만 생성. false면 기존 SA를 name으로 참조.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "redis-api-chart.serviceAccountName" . }}
  namespace: queuing-a
  labels:
    {{- include "redis-api-chart.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# true면 SA 토큰이 파드에 자동 마운트됨 (/var/run/secrets/kubernetes.io/serviceaccount)
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
