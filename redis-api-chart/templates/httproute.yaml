# =============================================================================
# [HTTPRoute] Gateway API 기반 HTTP 라우팅 (Ingress의 차세대 대안).
# Ingress보다 더 세밀한 라우팅 규칙(헤더, 쿼리파라미터 매칭, 가중치 분배 등)을 지원.
#
# 사전 요구사항:
#   - Gateway API CRD가 설치되어야 함 (kubectl apply -k gateway-api)
#   - Gateway Controller (Envoy Gateway, Istio 등)가 실행 중이어야 함
#   - parentRefs에서 참조하는 Gateway 리소스가 존재해야 함
#
# 현재 비활성화 (httpRoute.enabled: false).
# =============================================================================
{{- if .Values.httpRoute.enabled -}}
{{- $fullName := include "redis-api-chart.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "redis-api-chart.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # 이 HTTPRoute가 연결될 Gateway 리소스
  parentRefs:
    {{- with .Values.httpRoute.parentRefs }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  # 요청을 받을 호스트 이름 (도메인)
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  # 라우팅 규칙: 매칭 조건 → 필터 → 백엔드 Service
  rules:
    {{- range .Values.httpRoute.rules }}
    {{- with .matches }}
    - matches:
      {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .filters }}
      filters:
      {{- toYaml . | nindent 8 }}
    {{- end }}
      backendRefs:
        - name: {{ $fullName }}
          port: {{ $svcPort }}
          weight: 1
    {{- end }}
{{- end }}
