# =============================================================================
# [Deployment] API 서버 파드의 배포 전략과 컨테이너 스펙을 정의.
# ReplicaSet을 관리하여 지정된 수의 파드가 항상 실행되도록 보장한다.
# 롤링 업데이트 시 새 버전 파드를 먼저 띄우고 → 구 버전을 순차적으로 내린다.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redis-api-chart.fullname" . }}
  namespace: queuing-a
  labels:
    {{- include "redis-api-chart.labels" . | nindent 4 }}
spec:
  # HPA(오토스케일링)가 비활성화일 때만 고정 레플리카 수 적용
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "redis-api-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "redis-api-chart.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # 프라이빗 레지스트리 인증 시크릿 (Docker Hub 퍼블릭이면 불필요)
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "redis-api-chart.serviceAccountName" . }}
      # 파드 수준 보안 컨텍스트 (fsGroup, runAsUser 등)
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          # 컨테이너 수준 보안 컨텍스트 (readOnlyRootFilesystem 등)
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # 컨테이너 이미지: repository:tag 형태로 조합
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # 컨테이너가 리슨하는 포트 (Service의 targetPort와 매칭)
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # 환경변수 주입 — values.yaml의 env 섹션에서 가져옴
          env:
            - name: REDIS_HOST
              value: {{ .Values.env.redisHost | quote }}
            - name: REDIS_PORT
              value: {{ .Values.env.redisPort | quote }}
            - name: DB_HOST
              value: {{ .Values.env.dbHost | quote }}
            - name: DB_PORT
              value: {{ .Values.env.dbPort | quote }}
            - name: DB_USER
              value: {{ .Values.env.dbUser | quote }}
            # DB 비밀번호는 Secret에서 참조 (평문 노출 방지)
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbPasswordSecret.name }}
                  key: {{ .Values.dbPasswordSecret.key }}
            - name: DB_NAME
              value: {{ .Values.env.dbName | quote }}
            - name: NODE_ENV
              value: {{ .Values.env.nodeEnv | quote }}
            - name: NODE_OPTIONS
              value: {{ .Values.env.nodeOptions | quote }} # Node.js V8 힙 메모리 고갈로 인한 파드 부하시 프로세스 죽음 현상 해결
            {{- if .Values.recaptcha.enabled }}
            # reCAPTCHA Secret Key는 Helm values나 매니페스트에 평문으로 기록하지 않고 외부 Secret에서 주입한다.
            - name: RECAPTCHA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "recaptcha.secret.name must be set when recaptcha.enabled=true" .Values.recaptcha.secret.name }}
                  key: {{ required "recaptcha.secret.key must be set when recaptcha.enabled=true" .Values.recaptcha.secret.key }}
            - name: RECAPTCHA_REQUIRED
              value: {{ .Values.recaptcha.required | quote }}
            - name: RECAPTCHA_SCORE_THRESHOLD
              value: {{ .Values.recaptcha.scoreThreshold | quote }}
            - name: RECAPTCHA_ALLOWED_HOSTNAMES
              value: {{ .Values.recaptcha.allowedHostnames | quote }}
            {{- end }}
            {{- if .Values.smtp.enabled }}
            # SMTP 계정과 App Password는 외부 Kubernetes Secret에서 주입한다.
            - name: SMTP_HOST
              value: {{ .Values.smtp.host | quote }}
            - name: SMTP_PORT
              value: {{ .Values.smtp.port | quote }}
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: {{ required "smtp.secret.name must be set when smtp.enabled=true" .Values.smtp.secret.name }}
                  key: {{ required "smtp.secret.userKey must be set when smtp.enabled=true" .Values.smtp.secret.userKey }}
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ required "smtp.secret.name must be set when smtp.enabled=true" .Values.smtp.secret.name }}
                  key: {{ required "smtp.secret.passwordKey must be set when smtp.enabled=true" .Values.smtp.secret.passwordKey }}
            {{- if .Values.smtp.fromEmail }}
            - name: FROM_EMAIL
              value: {{ .Values.smtp.fromEmail | quote }}
            {{- end }}
            {{- end }}
            - name: AWS_ENDPOINT
              value: {{ .Values.env.awsEndpoint | quote }}
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.env.awsAccessKeyId | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.env.awsSecretAccessKey | quote }}
          # Liveness Probe: 실패 시 컨테이너 재시작 (죽은 프로세스 복구)
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Readiness Probe: 실패 시 트래픽 차단 (과부하 보호)
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # CPU/메모리 리소스 제한
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # 볼륨 마운트 (설정파일, 로그 영속화 등)
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      # 볼륨 정의 (ConfigMap, PVC, EmptyDir 등)
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # 노드 셀렉터: 특정 라벨의 노드에만 배치
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # 어피니티: 노드/파드 간 친화성·반친화성 규칙
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # 톨러레이션: taint된 노드에도 배치 허용
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
