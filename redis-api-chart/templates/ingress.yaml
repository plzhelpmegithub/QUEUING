# =============================================================================
# [Ingress] L7(HTTP/HTTPS) 수준의 외부 트래픽 라우팅.
# 도메인 이름 기반으로 트래픽을 Service에 분배한다.
# 예: api.queuing.kr → 이 Service로 라우팅, TLS 인증서 자동 적용.
#
# 사전 요구사항:
#   - Ingress Controller (nginx-ingress, traefik 등)가 클러스터에 설치되어야 함.
#   - TLS 사용 시 cert-manager 또는 수동 Secret 생성 필요.
#
# 현재 비활성화 (ingress.enabled: false) — NodePort 직접 접근 방식 사용 중.
# =============================================================================
{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "redis-api-chart.fullname" . }}
  labels:
    {{- include "redis-api-chart.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # 사용할 Ingress Controller 클래스 (nginx, traefik 등)
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  # TLS 설정 (HTTPS 인증서)
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  # 라우팅 규칙: 호스트 + 경로 → Service 매핑
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                name: {{ include "redis-api-chart.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
