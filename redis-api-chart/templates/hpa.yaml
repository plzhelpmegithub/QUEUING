# =============================================================================
# [HPA - Horizontal Pod Autoscaler] CPU/메모리 사용률에 따라 파드 수 자동 조절.
# autoscaling.enabled: true 일 때만 이 리소스가 생성됨.
#
# 동작 원리:
#   1. metrics-server가 파드의 CPU/메모리 사용률을 수집
#   2. target 비율(예: CPU 70%)을 초과하면 파드를 추가 (스케일 아웃)
#   3. 사용률이 낮아지면 파드를 줄임 (스케일 인)
#   4. minReplicas ~ maxReplicas 범위 내에서만 조절
#
# 주의: metrics-server가 클러스터에 설치되어 있어야 동작함.
# =============================================================================
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "redis-api-chart.fullname" . }}
  labels:
    {{- include "redis-api-chart.labels" . | nindent 4 }}
spec:
  # 스케일링 대상 Deployment
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "redis-api-chart.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    # CPU 기반 스케일링: 평균 사용률이 target%를 넘으면 스케일 아웃
    {{- if .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    # 메모리 기반 스케일링 (선택사항)
    {{- if .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
